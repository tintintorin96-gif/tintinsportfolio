name: Daily Portfolio Theme

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-theme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run theme:daily
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - run: npm run theme:check

      - name: Commit theme
        run: |
          git config user.name "daily-theme-agent"
          git config user.email "daily-theme-agent@users.noreply.github.com"
          git add src/generated/theme.json obsidian/design-trends
          git commit -m "Update daily portfolio theme" || exit 0
          git push
